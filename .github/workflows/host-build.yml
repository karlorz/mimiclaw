name: Host Build & Smoke

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./scripts/host/install-deps-ubuntu.sh

      - name: Install deps (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          ./scripts/host/install-deps-macos.sh

      - name: Build and smoke (shared repo flow)
        run: |
          BUILD_DIR=build-host ./scripts/host/ci.sh

      - name: Upload host smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: host-smoke-logs-${{ matrix.os }}
          path: |
            .tmp/mimiclaw-host-smoke/host.log
            .tmp/mimiclaw-host-smoke/config.json
          if-no-files-found: ignore
